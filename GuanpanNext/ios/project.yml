name: GuanpanNext
options:
  bundleIdPrefix: com.guanpan.next
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '3.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  GuanpanNext:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guanpan.next.ios
        PRODUCT_NAME: GuanpanNext
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 观盘 Pro
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 手动连接你配置的NAS服务，读取行情和同步你确认的账本。
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        CODE_SIGNING_ALLOWED: NO
  GuanpanNextUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: GuanpanNext
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guanpan.next.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  GuanpanNext:
    build:
      targets:
        GuanpanNext: all
        GuanpanNextUITests: [test]
    test:
      targets:
        - GuanpanNextUITests
