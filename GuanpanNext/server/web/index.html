<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>观盘 Pro Next</title>
<style>
body{max-width:760px;margin:0 auto;padding:24px;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#202820;background:#f7f7f2}header{padding:16px 0;border-bottom:1px solid #d5dbd0}h1{font-family:Georgia,"Songti SC",serif;margin:0}section{background:#fff;margin:18px 0;padding:18px;border-radius:16px}button{padding:10px 14px;border:0;border-radius:10px;background:#173d35;color:#fff;font-weight:600}button+button{margin-left:8px}pre{white-space:pre-wrap;background:#f4f5f1;padding:12px;border-radius:8px;max-height:280px;overflow:auto}.muted{color:#64706a;font-size:14px;white-space:pre-wrap}input{margin:8px 0}
</style>
<body><header><h1>观盘 Pro Next</h1><p class="muted">家庭 NAS 数据中心 · 网页、iPhone 和 NAS 使用同一份新账本</p></header>
<section><b>真实账本</b><p id="state">正在读取…</p><button onclick="loadBook()">刷新</button><button onclick="downloadBook()">下载账本备份</button><pre id="book"></pre></section>
<section><b>后台数据线</b><p id="workers" class="muted">正在读取…</p></section>
<section><b>行情档案核对</b><p class="muted">读取 NAS 已归档的日 K 或指定交易日分时；空结果表示该代码尚未采集，不会伪造历史曲线。</p><input id="code" inputmode="numeric" maxlength="6" value="159941" aria-label="6 位证券代码"><input id="day" type="date" aria-label="分时日期"><br><button onclick="loadDaily()">读取日 K</button><button onclick="loadMinute()">读取分时</button><pre id="market">尚未查询</pre></section>
<section><b>从备份恢复到 NAS</b><p class="muted">恢复会创建新修订，不会删除历史版本。请先核对文件并明确确认。</p><input id="file" type="file" accept="application/json"><br><label><input id="confirm" type="checkbox"> 我已核对文件，确认写入新账本</label><br><button onclick="uploadBook()">确认恢复</button></section>
<script>
let remote;const $=id=>document.getElementById(id);
async function loadBook(){try{let r=await fetch('/v1/real/books/main',{cache:'no-store'});remote=await r.json();if(!r.ok)throw Error(remote.error);$('state').textContent=remote.bookJSON?'修订 '+remote.revision+' · 已保存':'NAS 尚无新账本';$('book').textContent=remote.bookJSON?JSON.stringify(JSON.parse(remote.bookJSON),null,2):'暂无数据'}catch(e){$('state').textContent='读取失败：'+e.message}}
async function loadWorkers(){try{let r=await fetch('/health',{cache:'no-store'}),v=await r.json();$('workers').textContent=(v.workers||[]).length?(v.workers||[]).map(x=>x.name+' · '+x.state+' · '+x.detail).join('\n'):'服务刚启动，等待后台线首次上报'}catch(e){$('workers').textContent='状态读取失败：'+e.message}}
function marketCode(){let code=$('code').value.trim();if(!/^\d{6}$/.test(code))throw Error('请输入 6 位证券代码');return code}
async function showArchive(path){try{let r=await fetch(path,{cache:'no-store'}),v=await r.json();if(!r.ok)throw Error(v.error||'读取失败');$('market').textContent=JSON.stringify(v,null,2)}catch(e){$('market').textContent='未读取：'+e.message}}
function loadDaily(){try{showArchive('/v1/market/daily/'+marketCode())}catch(e){$('market').textContent=e.message}}
function loadMinute(){try{let day=$('day').value;if(!day)throw Error('请选择分时日期');showArchive('/v1/market/minute/'+marketCode()+'?day='+encodeURIComponent(day))}catch(e){$('market').textContent=e.message}}
function downloadBook(){if(!remote?.bookJSON)return alert('当前没有可下载的账本');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([remote.bookJSON],{type:'application/json'}));a.download='guanpan-next-book-r'+remote.revision+'.json';a.click();URL.revokeObjectURL(a.href)}
async function uploadBook(){let f=$('file').files[0];if(!f)return alert('请选择账本 JSON 文件');if(!$('confirm').checked)return alert('请先确认恢复');let text=await f.text();try{JSON.parse(text);let r=await fetch('/v1/real/books/main',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'manual-confirmed',expectedRevision:remote?.revision??0,bookJSON:text})});let v=await r.json();if(!r.ok)throw Error(v.error);alert('恢复完成，修订 '+v.revision);$('confirm').checked=false;await loadBook()}catch(e){alert('未保存：'+e.message)}}
loadBook();loadWorkers()
</script></body></html>
