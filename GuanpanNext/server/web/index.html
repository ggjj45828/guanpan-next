<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>观盘 Pro Next</title>
<style>
body{max-width:760px;margin:0 auto;padding:24px;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#202820;background:#f7f7f2}header{padding:16px 0;border-bottom:1px solid #d5dbd0}h1{font-family:Georgia,"Songti SC",serif;margin:0}section{background:#fff;margin:18px 0;padding:18px;border-radius:16px}button{padding:10px 14px;border:0;border-radius:10px;background:#173d35;color:#fff;font-weight:600}button+button{margin-left:8px}pre,textarea{white-space:pre-wrap;background:#f4f5f1;padding:12px;border:1px solid #d5dbd0;border-radius:8px;max-height:420px;overflow:auto;width:calc(100% - 26px);font:13px ui-monospace,SFMono-Regular,Menlo,monospace}textarea{height:320px;max-height:none;resize:vertical;white-space:pre}.muted{color:#64706a;font-size:14px;white-space:pre-wrap}input{margin:8px 0}
</style>
<body><header><h1>观盘 Pro Next</h1><p class="muted">家庭 NAS 数据中心 · 网页、iPhone 和 NAS 使用同一份新账本</p></header>
<section><b>真实账本</b><p id="state">正在读取…</p><button onclick="loadBook()">刷新</button><button onclick="downloadBook()">下载账本备份</button><p class="muted">可编辑新账本 JSON 并明确保存。写入采用 NAS 修订号；遇到冲突不会覆盖，手机端可重新下载已保存账本。</p><textarea id="editor" spellcheck="false" aria-label="编辑真实账本 JSON" placeholder="暂无账本；可导入现有的新账本 JSON"></textarea><br><label><input id="editConfirm" type="checkbox"> 我确认将编辑内容保存为下一版 NAS 真实账本</label><br><button onclick="saveEditedBook()">保存编辑到 NAS</button><p id="saveStatus" class="muted"></p><pre id="book"></pre></section>
<section><b>后台数据线</b><p class="muted">心跳超过 40 分钟会标记为过期；页面每 30 秒刷新一次。</p><p id="workers" class="muted">正在读取…</p></section>
<section><b>行情档案核对</b><p class="muted">读取 NAS 已归档的日 K 或指定交易日分时；空结果表示该代码尚未采集，不会伪造历史曲线。</p><input id="code" inputmode="numeric" maxlength="6" value="159941" aria-label="6 位证券代码"><input id="day" type="date" aria-label="分时日期"><br><button onclick="loadDaily()">读取日 K</button><button onclick="loadMinute()">读取分时</button><pre id="market">尚未查询</pre></section>
<section><b>从备份恢复到 NAS</b><p class="muted">恢复会创建新修订，不会删除历史版本。请先核对文件并明确确认。</p><input id="file" type="file" accept="application/json"><br><label><input id="confirm" type="checkbox"> 我已核对文件，确认写入新账本</label><br><button onclick="uploadBook()">确认恢复</button></section>
<script>
let remote;const $=id=>document.getElementById(id);
async function loadBook(){try{let r=await fetch('/v1/real/books/main',{cache:'no-store'});remote=await r.json();if(!r.ok)throw Error(remote.error);$('state').textContent=remote.bookJSON?'修订 '+remote.revision+' · 已保存':'NAS 尚无新账本';$('book').textContent=remote.bookJSON?JSON.stringify(JSON.parse(remote.bookJSON),null,2):'暂无数据';$('editor').value=remote.bookJSON?JSON.stringify(JSON.parse(remote.bookJSON),null,2):'';$('saveStatus').textContent='当前 NAS 修订 '+remote.revision}catch(e){$('state').textContent='读取失败：'+e.message}}
async function saveEditedBook(){if(!$('editConfirm').checked){$('saveStatus').textContent='未保存：请先勾选确认';return}try{let raw=$('editor').value;JSON.parse(raw);if(!remote)throw Error('尚未读取 NAS 当前修订');let r=await fetch('/v1/real/books/main',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'manual-confirmed',expectedRevision:remote.revision,bookJSON:raw})});let v=await r.json();if(r.status===409)throw Error('修订冲突，未覆盖 NAS 数据；请刷新并核对差异后再保存');if(!r.ok)throw Error(v.error||'保存失败');$('saveStatus').textContent='保存成功 · NAS 修订 '+v.revision+' · 手机端可执行下载同步';$('editConfirm').checked=false;await loadBook()}catch(e){$('saveStatus').textContent='未保存：'+e.message}}
async function loadWorkers(){try{let r=await fetch('/health',{cache:'no-store'}),v=await r.json(),lines=(v.workers||[]).map(x=>{let age=x.ageSeconds==null?'时间无效':x.ageSeconds<60?x.ageSeconds+' 秒前':Math.floor(x.ageSeconds/60)+' 分钟前';return x.name+' · '+(x.health||x.state)+' · 心跳 '+age+'\n'+x.detail});if(!lines.length)lines.push('服务刚启动，等待后台线首次上报');if(v.aiProvider)lines.push('DeepSeek · '+v.aiProvider.state+' · '+v.aiProvider.profile+' / '+(v.aiProvider.model||'未配置模型')+'\n'+v.aiProvider.message);$('workers').textContent=lines.join('\n\n')}catch(e){$('workers').textContent='状态读取失败：'+e.message}}
function marketCode(){let code=$('code').value.trim();if(!/^\d{6}$/.test(code))throw Error('请输入 6 位证券代码');return code}
async function showArchive(path){try{let r=await fetch(path,{cache:'no-store'}),v=await r.json();if(!r.ok)throw Error(v.error||'读取失败');$('market').textContent=JSON.stringify(v,null,2)}catch(e){$('market').textContent='未读取：'+e.message}}
function loadDaily(){try{showArchive('/v1/market/daily/'+marketCode())}catch(e){$('market').textContent=e.message}}
function loadMinute(){try{let day=$('day').value;if(!day)throw Error('请选择分时日期');showArchive('/v1/market/minute/'+marketCode()+'?day='+encodeURIComponent(day))}catch(e){$('market').textContent=e.message}}
function downloadBook(){if(!remote?.bookJSON)return alert('当前没有可下载的账本');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([remote.bookJSON],{type:'application/json'}));a.download='guanpan-next-book-r'+remote.revision+'.json';a.click();URL.revokeObjectURL(a.href)}
async function uploadBook(){let f=$('file').files[0];if(!f)return alert('请选择账本 JSON 文件');if(!$('confirm').checked)return alert('请先确认恢复');let text=await f.text();try{JSON.parse(text);let r=await fetch('/v1/real/books/main',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'manual-confirmed',expectedRevision:remote?.revision??0,bookJSON:text})});let v=await r.json();if(!r.ok)throw Error(v.error);alert('恢复完成，修订 '+v.revision);$('confirm').checked=false;await loadBook()}catch(e){alert('未保存：'+e.message)}}
loadBook();loadWorkers();setInterval(loadWorkers,30000)
</script></body></html>
