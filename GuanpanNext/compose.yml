version: "3.8"
name: guanpan-next

services:
  guanpan-next:
    build: ./server
    ports:
      - "30001:8786"
    environment:
      GUANPAN_NEXT_DATA: /data
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GUANPAN_AI_PROFILE: ${GUANPAN_AI_PROFILE:-flash}
      GUANPAN_AI_BASE_URL: ${GUANPAN_AI_BASE_URL:-}
      GUANPAN_AI_MODEL: ${GUANPAN_AI_MODEL:-}
    volumes:
      # 代码走宿主机挂载：更新时只要把新的 server/ 覆盖进部署目录，重启容器即生效，
      # 不需要 docker build。镜像只负责 Python 运行时和 tzdata。
      # 只读挂载，防止容器内进程改到源码（运行时数据一律写 /data）。
      - ./server:/app:ro
      - guanpan_next_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8786/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
volumes:
  guanpan_next_data:
