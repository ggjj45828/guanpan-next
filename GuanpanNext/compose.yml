version: "3.8"
name: guanpan-next

services:
  guanpan-next:
    build: ./server
    ports:
      - "30001:8786"
    environment:
      GUANPAN_NEXT_DATA: /data
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GUANPAN_AI_PROFILE: ${GUANPAN_AI_PROFILE:-flash}
      GUANPAN_AI_BASE_URL: ${GUANPAN_AI_BASE_URL:-}
      GUANPAN_AI_MODEL: ${GUANPAN_AI_MODEL:-}
    volumes:
      # 宿主机代码挂到 /opt/guanpan-src（**不要挂到 /app**）：容器启动时 start.sh 会把这里
      # 的代码同步进 /app。之所以不直接挂 /app：当挂载源解析不到时，Docker 会建一个空目录
      # 盖住镜像里的代码，容器直接起不来（python: can't open file '/app/app.py'）。
      # 现在挂载源缺失只会退化成"用镜像内置版本"，服务照常可用。
      #
      # 路径可用环境变量覆盖：某些 NAS 面板会把 compose 拷到它自己的目录执行，
      # 这时 `./server` 会解析到别处、挂载为空。在 .env 里写
      #   GUANPAN_CODE_DIR=/你的部署目录/server
      # 用绝对路径最稳。默认仍是相对路径，命令行部署无需配置。
      - ${GUANPAN_CODE_DIR:-./server}:/opt/guanpan-src:ro
      - guanpan_next_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8786/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
volumes:
  guanpan_next_data:
